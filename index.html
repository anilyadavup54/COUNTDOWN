<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Sand-Timer Countdown</title>
    <style>
        /* Modern CSS Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        /* Pure Black Dark Theme Background */
        body {
            background-color: #000000;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
        }

        /* Container Framework */
        .container {
            width: 100%;
            max-width: 700px;
            text-align: center;
            padding: 20px;
        }

        /* Hide specific interface components automatically inside native fullscreen mode */
        body:fullscreen .hide-on-fullscreen {
            display: none !important;
        }

        /* Custom Bold Title Display Header */
        .custom-headline {
            font-size: clamp(24px, 5vw, 42px);
            font-weight: 900; /* Ultra bold weight setting */
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 40px;
            color: #ffffff;
            line-height: 1.2;
            word-wrap: break-word;
        }

        /* Setup Interface Core Flex Layout grid */
        .config-dashboard {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px;
            margin-bottom: 50px;
            background: #050505;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #111111;
        }

        .controls-wrapper {
            display: flex;
            flex-direction: column;
            gap: 15px;
            flex: 1;
            max-width: 400px;
        }

        .input-block {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        label {
            font-size: 11px;
            color: #666666;
            text-transform: uppercase;
            margin-bottom: 5px;
            letter-spacing: 1px;
            font-weight: 600;
        }

        input {
            background: #0d0d0d;
            border: 1px solid #222222;
            color: #ffffff;
            padding: 12px;
            font-size: 15px;
            border-radius: 6px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #444444;
        }

        /* Sand Timer Rotating Icon Component Frame */
        .icon-container {
            display: flex;
            justify-content: center;
            align-items: center;
            padding-left: 10px;
        }

        /* CSS Keyframe Animation Sequence Engine for continuous loop rotations */
        @keyframes endlessRotation {
            0% { transform: rotate(0deg); }
            45% { transform: rotate(0deg); }
            55% { transform: rotate(180deg); }
            100% { transform: rotate(180deg); }
        }

        .sand-timer-svg {
            width: 70px;
            height: 70px;
            fill: none;
            stroke: #ffffff;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            animation: endlessRotation 4s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite;
        }

        /* Dashboard Numbers Layout display panel grid */
        .display-board {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin: 20px 0;
        }

        .time-card {
            min-width: 110px;
        }

        /* Giant Numeric Values formatting text */
        .digit {
            font-size: clamp(45px, 9vw, 85px);
            font-weight: 800;
            display: block;
            color: #ffffff;
            line-height: 1;
            font-variant-numeric: tabular-nums; /* Prevents shifting shake text jitters */
        }

        .tag {
            font-size: 11px;
            color: #555555;
            text-transform: uppercase;
            margin-top: 10px;
            display: block;
            letter-spacing: 2px;
            font-weight: 600;
        }

        /* Notice banner container alerts output styles */
        .notice {
            font-size: 13px;
            color: #ff3333;
            margin-top: 30px;
            letter-spacing: 1px;
            font-weight: 500;
        }

        /* Interactive Action Buttons styling */
        .btn-fullscreen {
            background: #111111;
            border: 1px solid #222222;
            color: #777777;
            padding: 12px 24px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 40px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .btn-fullscreen:hover {
            background: #ffffff;
            color: #000000;
            border-color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Live Custom Target Header Node Display -->
        <div class="custom-headline" id="headlineDisplay">MY COUNTDOWN</div>
        
        <!-- Control Setup Area Layout block containing inputs and sand icon -->
        <div class="config-dashboard hide-on-fullscreen">
            <div class="controls-wrapper">
                <div class="input-block">
                    <label for="textInput">Custom Bold Headline Text</label>
                    <input type="text" id="textInput" value="MY COUNTDOWN" placeholder="Type event name here...">
                </div>
                <div class="input-block">
                    <label for="datePicker">Select Target Date</label>
                    <input type="date" id="datePicker">
                </div>
                <div class="input-block">
                    <label for="timePicker">Select Target Time</label>
                    <input type="time" id="timePicker" value="00:00">
                </div>
            </div>

            <!-- Sand Timer Spinning Graphic Structure Node Element -->
            <div class="icon-container">
                <svg class="sand-timer-svg" viewBox="0 0 24 24">
                    <!-- Glass Outline Structure -->
                    <path d="M5 2h14M5 22h14M5 2c0 4 3 6 7 8m-7 -8v3m14 -3c0 4-3 6-7 8m7 -8v3" />
                    <path d="M5 22c0-4 3-6 7-8m-7 8v-3m14 3c0-4-3-6-7-8m7 8v-3" />
                    <!-- Sand Elements Inside -->
                    <path d="M6 6h12M7 8h10M11 12h2M7 16h10M6 18h12" opacity="0.6" stroke-width="1.5" />
                </svg>
            </div>
        </div>

        <!-- Timer Matrix Numerical Output Blocks -->
        <div class="display-board">
            <div class="time-card">
                <span class="digit" id="daysDisplay">00</span>
                <span class="tag">Days</span>
            </div>
            <div class="time-card">
                <span class="digit" id="hoursDisplay">00</span>
                <span class="tag">Hours</span>
            </div>
            <div class="time-card">
                <span class="digit" id="minsDisplay">00</span>
                <span class="tag">Minutes</span>
            </div>
        </div>

        <div class="notice" id="alertNotice"></div>

        <!-- Fullscreen Activation Button Control element -->
        <button class="btn-fullscreen hide-on-fullscreen" id="fullscreenBtn">Launch Fullscreen</button>
    </div>

    <script>
        // DOM Elements Initialization Mapping Selection
        const textInput = document.getElementById('textInput');
        const headlineDisplay = document.getElementById('headlineDisplay');
        const datePicker = document.getElementById('datePicker');
        const timePicker = document.getElementById('timePicker');
        const daysDisplay = document.getElementById('daysDisplay');
        const hoursDisplay = document.getElementById('hoursDisplay');
        const minsDisplay = document.getElementById('minsDisplay');
        const alertNotice = document.getElementById('alertNotice');
        const fullscreenBtn = document.getElementById('fullscreenBtn');

        // Set Default Input Calibration values to Current Local System Date Tracking Structure
        const currentSystemDate = new Date();
        const year = currentSystemDate.getFullYear();
        const month = String(currentSystemDate.getMonth() + 1).padStart(2, '0');
        const day = String(currentSystemDate.getDate()).padStart(2, '0');
        datePicker.value = `${year}-${month}-${day}`;

        let countdownLoop;

        // Interactive Title Update Routine Handler
        textInput.addEventListener('input', () => {
            const trimmedText = textInput.value.trim();
            headlineDisplay.innerText = trimmedText !== "" ? trimmedText : "COUNTDOWN";
        });

        // Core Mathematical Time Delta Processing Method Engine Loop 
        function parseAndRefreshClock() {
            const chosenDate = datePicker.value;
            const chosenTime = timePicker.value;

            if (!chosenDate) return;

            // Merge dynamic field configuration options into structured ISO timestamps
            const combinedString = `${chosenDate}T${chosenTime}`;
            const targetMs = new Date(combinedString).getTime();
            
            // Read tracking snapshot data from device hardware framework clock
            const currentMs = new Date().getTime();
            const timeDifference = targetMs - currentMs;

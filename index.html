<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Black Countdown & Fullscreen</title>
    <style>
        /* Modern CSS Clean Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace; /* Clean digital font feel */
        }

        /* Pure Black Dark Theme Background */
        body {
            background-color: #000000;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        /* Container Framework */
        .container {
            width: 100%;
            max-width: 650px;
            text-align: center;
            padding: 20px;
        }

        /* Hide interface elements automatically when in fullscreen mode */
        body:fullscreen .hide-on-fullscreen {
            display: none !important;
        }

        h1 {
            font-size: 20px;
            font-weight: 400;
            letter-spacing: 2px;
            margin-bottom: 30px;
            color: #888888;
            text-transform: uppercase;
        }

        /* User Configuration Inputs Layout */
        .controls-wrapper {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 40px;
            max-width: 350px;
            margin-left: auto;
            margin-right: auto;
        }

        .input-block {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        label {
            font-size: 11px;
            color: #555555;
            text-transform: uppercase;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        input {
            background: #0d0d0d;
            border: 1px solid #222222;
            color: #ffffff;
            padding: 12px;
            font-size: 16px;
            border-radius: 4px;
            outline: none;
            text-align: center;
        }

        input:focus {
            border-color: #ffffff;
        }

        /* Dashboard Numbers Frame */
        .display-board {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
        }

        .time-card {
            min-width: 100px;
            padding: 10px;
        }

        /* Giant Numeric Values */
        .digit {
            font-size: clamp(40px, 8vw, 75px);
            font-weight: bold;
            display: block;
            color: #ffffff;
            line-height: 1;
        }

        .tag {
            font-size: 11px;
            color: #444444;
            text-transform: uppercase;
            margin-top: 8px;
            display: block;
            letter-spacing: 1px;
        }

        /* Dynamic Status Feedback */
        .notice {
            font-size: 14px;
            color: #ff3333;
            margin-top: 20px;
            letter-spacing: 1px;
        }

        /* Action Buttons styling */
        .btn-fullscreen {
            background: #111111;
            border: 1px solid #333333;
            color: #888888;
            padding: 10px 20px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 40px;
            transition: 0.2s;
        }

        .btn-fullscreen:hover {
            background: #ffffff;
            color: #000000;
            border-color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="container">
        <p>29/09/2026</p>
        <p>07:20 AM</p>
        <h1 class="hide-on-fullscreen">Target Event Countdown</h1>
        
        <!-- Setup Inputs Section (Auto hides inside Fullscreen) -->
        <div class="controls-wrapper hide-on-fullscreen">
            <div class="input-block">
                <label for="datePicker">Select Date</label>
                <input type="date" id="datePicker">
            </div>
            <div class="input-block">
                <label for="timePicker">Select Time</label>
                <input type="time" id="timePicker" value="00:00">
            </div>
        </div>

        <!-- Timer Panel Outputs (Stays Visible Everywhere) -->
        <div class="display-board">
            <div class="time-card">
                <span class="digit" id="daysDisplay">00</span>
                <span class="tag">Days</span>
            </div>
            <div class="time-card">
                <span class="digit" id="hoursDisplay">00</span>
                <span class="tag">Hours</span>
            </div>
            <div class="time-card">
                <span class="digit" id="minsDisplay">00</span>
                <span class="tag">Mins</span>
            </div>
            <div class="time-card">
                <span class="digit" id="secsDisplay">00</span>
                <span class="tag">Secs</span>
            </div>
        </div>

        <div class="notice" id="alertNotice"></div>

        <!-- Fullscreen Trigger UI -->
        <button class="btn-fullscreen hide-on-fullscreen" id="fullscreenBtn">Enter Fullscreen</button>
    </div>

    <script>
        // DOM Elements
        const datePicker = document.getElementById('datePicker');
        const timePicker = document.getElementById('timePicker');
        const daysDisplay = document.getElementById('daysDisplay');
        const hoursDisplay = document.getElementById('hoursDisplay');
        const minsDisplay = document.getElementById('minsDisplay');
        const secsDisplay = document.getElementById('secsDisplay');
        const alertNotice = document.getElementById('alertNotice');
        const fullscreenBtn = document.getElementById('fullscreenBtn');

        // Set Default Date Input Field value to Local Current System Day
        const currentSystemDate = new Date();
        const year = currentSystemDate.getFullYear();
        const month = String(currentSystemDate.getMonth() + 1).padStart(2, '0');
        const day = String(currentSystemDate.getDate()).padStart(2, '0');
        datePicker.value = `${year}-${month}-${day}`;

        let countdownLoop;

        // Core Countdown Engine Math Logic
        function parseAndRefreshClock() {
            const chosenDate = datePicker.value;
            const chosenTime = timePicker.value;

            if (!chosenDate) return;

            // Merging fields to valid ISO standard timestamp
            const combinedString = `${chosenDate}T${chosenTime}`;
            const targetMs = new Date(combinedString).getTime();
            
            // Auto capture current ongoing system clock frame
            const currentMs = new Date().getTime();
            const timeDifference = targetMs - currentMs;

            // Scenario tracking when target parameter passes out 
            if (timeDifference <= 0) {
                clearInterval(countdownLoop);
                daysDisplay.innerText = "00";
                hoursDisplay.innerText = "00";
                minsDisplay.innerText = "00";
                secsDisplay.innerText = "00";
                alertNotice.innerText = "[ EVENT HAS COMMENCED / TIME ELAPSED ]";
                return;
            }

            alertNotice.innerText = ""; // Wipe warning labels

            // Math breakdowns 
            const calcDays = Math.floor(timeDifference / (1000 * 60 * 60 * 24));
            const calcHours = Math.floor((timeDifference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const calcMins = Math.floor((timeDifference % (1000 * 60 * 60)) / (1000 * 60));
            const calcSecs = Math.floor((timeDifference % (1000 * 60)) / 1000);

            // Print values inside target layouts formatting into twin character sets
            daysDisplay.innerText = String(calcDays).padStart(2, '0');
            hoursDisplay.innerText = String(calcHours).padStart(2, '0');
            minsDisplay.innerText = String(calcMins).padStart(2, '0');
            secsDisplay.innerText = String(calcSecs).padStart(2, '0');
        }

        // Event hooks to trigger instant tracking re-calculations on modifications
        function resetIntervalEngine() {
            clearInterval(countdownLoop);
            parseAndRefreshClock();
            countdownLoop = setInterval(parseAndRefreshClock, 1000);
        }

        datePicker.addEventListener('input', resetIntervalEngine);
        timePicker.addEventListener('input', resetIntervalEngine);

        // Native Fullscreen API Integration Manager
        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    alert(`Error attempting to enable full-screen mode: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
        });

        // Initialize immediately upon code generation setup
        resetIntervalEngine();
    </script>
</body>
</html>
